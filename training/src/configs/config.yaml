model:
  path: '../weights/actuator_model3.pt'
  hidden_size: 30
  num_layers: 4    
  dropout_rate: 0.03

data:
  train_data_path: '../data/data_2/test.csv'
  validation_data_path: '../data/data_2/validation.csv'
  eval_data_path: '../data/data_2/evaluation.csv'

training:
  lri: 0.0001     # Initial learning rate
  lrf: 0.000005   # Final learning rate (trying prevent overshoot the optimal solution)
  batch_size: 64
  patience: 200
  num_epochs: 3500
  pct_start: 0.12
  anneal_strategy: 'cos'
  weight_decay: 0.01

# TensorBoard Config
tensorboard:
  log_dir: 'runs/test3'  # Directory where TensorBoard logs will be stored

device: 'cuda'  
